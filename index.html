<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Kehadiran Siswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Portal Rekap Kehadiran Siswa</h1>
                <p class="text-indigo-200 text-sm mt-1">Ubah data kehadiran, lalu klik tombol download untuk memperbarui file HTML secara permanen.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="downloadHTML()" class="bg-emerald-500 hover:bg-emerald-400 text-white font-bold py-2 px-4 rounded-lg text-sm shadow transition flex items-center gap-2">
                    💾 Download HTML Terkini
                </button>
                <button onclick="toggleModal()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold py-2 px-4 rounded-lg text-sm shadow transition">
                    + Tambah Siswa
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">

        <!-- Controls Section -->
        <div class="bg-white p-4 sm:p-6 rounded-xl shadow-md mb-6 border border-slate-100 flex flex-col md:flex-row gap-4 justify-between items-center">
            
            <div class="flex flex-wrap items-center gap-4 w-full md:w-auto">
                <!-- Filter Kelas -->
                <div class="flex items-center gap-2">
                    <label for="classSelect" class="font-semibold text-slate-700 whitespace-nowrap text-sm">Kelas:</label>
                    <select id="classSelect" onchange="filterData()" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg p-2.5 outline-none font-medium">
                        <option value="ALL">Semua Kelas</option>
                        <optgroup label="Kelas 7">
                            <option value="7-A">Kelas 7-A</option>
                            <option value="7-B" selected>Kelas 7-B</option>
                            <option value="7-C">Kelas 7-C</option>
                        </optgroup>
                        <optgroup label="Kelas 8">
                            <option value="8-A">Kelas 8-A</option>
                            <option value="8-B">Kelas 8-B</option>
                            <option value="8-C">Kelas 8-C</option>
                            <option value="8-D">Kelas 8-D</option>
                        </optgroup>
                        <optgroup label="Kelas 9">
                            <option value="9-A">Kelas 9-A</option>
                            <option value="9-B">Kelas 9-B</option>
                            <option value="9-C">Kelas 9-C</option>
                            <option value="9-D">Kelas 9-D</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Input Tanggal & Bulan Baru -->
                <div class="flex items-center gap-2 border-l pl-4 border-slate-200">
                    <label for="newDateInput" class="font-semibold text-slate-700 whitespace-nowrap text-sm">Tambah Tanggal:</label>
                    <input type="date" id="newDateInput" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg p-2 outline-none">
                    <button onclick="addDateColumn()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3 py-2 rounded-lg text-sm transition">
                        + Tambah
                    </button>
                </div>
            </div>

            <!-- Search Input -->
            <div class="w-full md:w-64">
                <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari nama atau NIS..." class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 focus:ring-indigo-500 outline-none">
            </div>
        </div>

        <!-- Ringkasan Total Absensi -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center">
                <span class="block text-xs font-bold text-emerald-600 uppercase tracking-wider">Hadir (H)</span>
                <span id="statHadir" class="text-2xl font-extrabold text-emerald-800">0</span>
            </div>
            <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-center">
                <span class="block text-xs font-bold text-blue-600 uppercase tracking-wider">Izin (I)</span>
                <span id="statIzin" class="text-2xl font-extrabold text-blue-800">0</span>
            </div>
            <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl text-center">
                <span class="block text-xs font-bold text-amber-600 uppercase tracking-wider">Sakit (S)</span>
                <span id="statSakit" class="text-2xl font-extrabold text-amber-800">0</span>
            </div>
            <div class="bg-rose-50 border border-rose-200 p-4 rounded-xl text-center">
                <span class="block text-xs font-bold text-rose-600 uppercase tracking-wider">Alpa (A)</span>
                <span id="statAlpa" class="text-2xl font-extrabold text-rose-800">0</span>
            </div>
        </div>

        <!-- Tabel Rekap -->
        <div class="bg-white rounded-xl shadow-md border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-slate-600">
                    <thead class="text-xs uppercase bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                        <tr id="tableHeader">
                            <!-- Header otomatis digenerate via JS -->
                        </tr>
                    </thead>
                    <tbody id="attendanceBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
            
            <div id="noDataMessage" class="hidden text-center py-12 text-slate-400">
                <p class="text-base font-medium">Siswa tidak ditemukan</p>
            </div>
        </div>

    </main>

    <!-- Modal Form Tambah Siswa -->
    <div id="studentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Tambah Siswa Baru</h3>
            <form onsubmit="addStudent(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Kelas</label>
                        <select id="addKelas" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50">
                            <option value="7-A">7-A</option>
                            <option value="7-B" selected>7-B</option>
                            <option value="7-C">7-C</option>
                            <option value="8-A">8-A</option>
                            <option value="8-B">8-B</option>
                            <option value="8-C">8-C</option>
                            <option value="8-D">8-D</option>
                            <option value="9-A">9-A</option>
                            <option value="9-B">9-B</option>
                            <option value="9-C">9-C</option>
                            <option value="9-D">9-D</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">NIS</label>
                        <input type="text" id="addNis" placeholder="Contoh: 121232170060267002" required class="w-full p-2.5 border rounded-lg text-sm bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Nama Lengkap</label>
                        <input type="text" id="addNama" placeholder="Nama Siswa" required class="w-full p-2.5 border rounded-lg text-sm bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Jenis Kelamin</label>
                        <select id="addGender" class="w-full p-2.5 border rounded-lg text-sm bg-slate-50">
                            <option value="L">Laki-laki (L)</option>
                            <option value="P">Perempuan (P)</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="toggleModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Batal</button>
                    <button type="submit" class="px-4 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg">Simpan</button>
                </div>
            </form>
        </div>
    </div>

        let datesData = JSON.parse(localStorage.getItem('absensi_dates')) || attendanceDates;

        function saveData() {
            localStorage.setItem('absensi_students', JSON.stringify(studentsData));
            localStorage.setItem('absensi_dates', JSON.stringify(datesData));
            filterData();
        }

        function toggleModal() {
            document.getElementById('studentModal').classList.toggle('hidden');
        }

        function addDateColumn() {
            const dateVal = document.getElementById('newDateInput').value;
            if(!dateVal) return alert("Pilih tanggal terlebih dahulu!");

            const [year, month, day] = dateVal.split('-');
            const formattedDate = `${day}/${month}`;

            if(datesData.includes(formattedDate)) {
                return alert("Tanggal ini sudah ada di tabel!");
            }

            datesData.push(formattedDate);
            
            studentsData.forEach(student => {
                student.attendance.push('H');
            });

            saveData();
            document.getElementById('newDateInput').value = '';
        }

        function removeDateColumn(index) {
            if(confirm(`Hapus kolom tanggal ${datesData[index]}?`)) {
                datesData.splice(index, 1);
                studentsData.forEach(student => {
                    student.attendance.splice(index, 1);
                });
                saveData();
            }
        }

        function addStudent(e) {
            e.preventDefault();
            const initialAttendance = new Array(datesData.length).fill('H');

            const newStudent = {
                id: Date.now(),
                kelas: document.getElementById('addKelas').value,
                nis: document.getElementById('addNis').value,
                nama: document.getElementById('addNama').value,
                gender: document.getElementById('addGender').value,
                attendance: initialAttendance
            };

            studentsData.push(newStudent);
            saveData();
            
            document.getElementById('addNis').value = '';
            document.getElementById('addNama').value = '';
            toggleModal();
        }

        function deleteStudent(id) {
            if(confirm("Apakah Anda yakin ingin menghapus siswa ini?")) {
                studentsData = studentsData.filter(s => s.id !== id);
                saveData();
            }
        }

        function toggleAttendance(studentId, dayIndex) {
            const student = studentsData.find(s => s.id === studentId);
            if (!student) return;

            const statuses = ['H', 'I', 'S', 'A'];
            const currentStatus = student.attendance[dayIndex] || 'H';
            const nextIndex = (statuses.indexOf(currentStatus) + 1) % statuses.length;
            
            student.attendance[dayIndex] = statuses[nextIndex];
            saveData();
        }

        function renderBadge(status, studentId, dayIndex) {
            let color = '';
            switch(status) {
                case 'H': color = 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200'; break;
                case 'I': color = 'bg-blue-100 text-blue-700 hover:bg-blue-200'; break;
                case 'S': color = 'bg-amber-100 text-amber-700 hover:bg-amber-200'; break;
                case 'A': color = 'bg-rose-100 text-rose-700 hover:bg-rose-200'; break;
                default: color = 'bg-slate-100 text-slate-500';
            }

            return `<button onclick="toggleAttendance(${studentId}, ${dayIndex})" 
                            title="Klik untuk mengubah status"
                            class="w-7 h-7 rounded font-bold text-xs transition cursor-pointer active:scale-90 ${color}">
                        ${status || 'H'}
                    </button>`;
        }

            const theadRow = document.getElementById('tableHeader');

                <th class="px-4 py-3 text-center">No</th>
                <th class="px-4 py-3 text-center">Kelas</th>
                <th class="px-4 py-3 text-center">NIS</th>
                <th class="px-4 py-3">Nama Siswa</th>
                <th class="px-4 py-3 text-center">L/P</th>
            `;

                headerHTML += `
                    <th class="px-3 py-3 text-center bg-slate-200/50 group relative">
                        <span>${dateStr}</span>
                        <button onclick="removeDateColumn(${idx})" title="Hapus tanggal ini" class="block mx-auto text-[10px] text-rose-500 hover:underline">Hapus</button>
                    </th>
                `;
            });

            headerHTML += `
                <th class="px-3 py-3 text-center text-emerald-700 bg-emerald-50">H</th>
                <th class="px-3 py-3 text-center text-blue-700 bg-blue-50">I</th>
                <th class="px-3 py-3 text-center text-amber-700 bg-amber-50">S</th>
                <th class="px-3 py-3 text-center text-rose-700 bg-rose-50">A</th>
                <th class="px-4 py-3 text-center bg-indigo-50 text-indigo-700">% Hadir</th>
                <th class="px-4 py-3 text-center">Aksi</th>
            `;
            theadRow.innerHTML = headerHTML;

            tbody.innerHTML = '';

            let filtered = studentsData.filter(student => {
                const matchClass = (selectedClass === 'ALL') || (student.kelas === selectedClass);
                const matchSearch = student.nama.toLowerCase().includes(searchKeyword) || student.nis.includes(searchKeyword);
                return matchClass && matchSearch;
            });

            if (filtered.length === 0) {
                noDataMsg.classList.remove('hidden');
                updateStats(0, 0, 0, 0);
                return;
            } else {
                noDataMsg.classList.add('hidden');
            }

            let totH = 0, totI = 0, totS = 0, totA = 0;

            filtered.forEach((student, index) => {
                const countH = student.attendance.filter(x => x === 'H').length;
                const countI = student.attendance.filter(x => x === 'I').length;
                const countS = student.attendance.filter(x => x === 'S').length;
                const countA = student.attendance.filter(x => x === 'A').length;

                totH += countH; totI += countI; totS += countS; totA += countA;
                
                const totalDays = datesData.length || 1;
                const percentage = Math.round((countH / totalDays) * 100);

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition-colors";
                row.innerHTML = `
                    <td class="px-4 py-3 text-center font-medium text-slate-500">${index + 1}</td>
                    <td class="px-4 py-3 text-center"><span class="px-2 py-1 text-xs bg-slate-100 border rounded font-semibold text-slate-600">${student.kelas}</span></td>
                    <td class="px-4 py-3 text-center font-mono text-xs">${student.nis}</td>
                    <td class="px-4 py-3 font-semibold text-slate-800">${student.nama}</td>
                    <td class="px-4 py-3 text-center text-xs text-slate-500">${student.gender}</td>
                    ${datesData.map((_, dayIdx) => `<td class="px-3 py-3 text-center">${renderBadge(student.attendance[dayIdx], student.id, dayIdx)}</td>`).join('')}
                    <td class="px-3 py-3 text-center font-bold text-emerald-600 bg-emerald-50/50">${countH}</td>
                    <td class="px-3 py-3 text-center font-bold text-blue-600 bg-blue-50/50">${countI}</td>
                    <td class="px-3 py-3 text-center font-bold text-amber-600 bg-amber-50/50">${countS}</td>
                    <td class="px-3 py-3 text-center font-bold text-rose-600 bg-rose-50/50">${countA}</td>
                    <td class="px-4 py-3 text-center font-bold text-indigo-600 bg-indigo-50/50">${percentage}%</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="deleteStudent(${student.id})" class="text-xs text-rose-500 hover:text-rose-700 font-semibold">Hapus</button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            updateStats(totH, totI, totS, totA);
        }

        function updateStats(h, i, s, a) {
            document.getElementById('statHadir').innerText = h;
            document.getElementById('statIzin').innerText = i;
            document.getElementById('statSakit').innerText = s;
            document.getElementById('statAlpa').innerText = a;
        }
// --- FUNGSI UPLOAD DATA (CSV/JSON) ---
        function processUploadedFile() {
            const fileInput = document.getElementById('importFileInput');
            const file = fileInput.files[0];

            if (!file) {
                return alert("Silakan pilih file CSV atau JSON terlebih dahulu!");
            }

            const reader = new FileReader();

            reader.onload = function(e) {
                const content = e.target.result;
                let newStudentsArr = [];

                try {
                    if (file.name.endsWith('.json')) {
                        newStudentsArr = JSON.parse(content);
                    } else if (file.name.endsWith('.csv')) {
                        const lines = content.split('\n');
                        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());

                        for (let i = 1; i < lines.length; i++) {
                            if (!lines[i].trim()) continue;
                            const values = lines[i].split(',').map(v => v.trim());
                            
                            let obj = {};
                            headers.forEach((header, index) => {
                                obj[header] = values[index] || '';
                            });

                            if (obj.nama && obj.nis) {
                                newStudentsArr.push({
                                    id: Date.now() + i,
                                    kelas: obj.kelas || "10-A",
                                    nis: obj.nis,
                                    nama: obj.nama,
                                    gender: (obj.gender || "L").toUpperCase(),
                                    attendance: new Array(attendanceDates.length).fill('H')
                                });

                    if (newStudentsArr.length === 0) {
                        return alert("Gagal membaca data dari file! Pastikan format kolom sesuai.");
                    }

                    // Gabungkan data baru ke daftar siswa yang ada
                    studentsData = [...studentsData, ...newStudentsArr];
                    saveData();
                    toggleUploadModal();
                    fileInput.value = '';
                    alert(`Berhasil menambahkan ${newStudentsArr.length} siswa baru!`);

                } catch (err) {
                    alert("Terjadi kesalahan saat memproses file: " + err.message);
                }
            };

            reader.readAsText(file);
        }

        // --- FITUR DOWNLOAD FILE HTML BARU PERMANEN ---
        function downloadHTML() {
            let docString = document.documentElement.outerHTML;

            // Inject data terbaru langsung ke variabel default
            const newDatesStr = `let attendanceDates = ${JSON.stringify(datesData, null, 12)};`;
            const newStudentsStr = `let defaultStudents = ${JSON.stringify(studentsData, null, 12)};`;

            docString = docString.replace(/let attendanceDates = \[[\s\S]*?\];/, newDatesStr);
            docString = docString.replace(/let defaultStudents = \[[\s\S]*?\];/, newStudentsStr);

            // Buat file blob dan trigger download
            const blob = new Blob(["<!DOCTYPE html>\n" + docString], { type: "text/html;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "index.html";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        filterData();
    </script>
